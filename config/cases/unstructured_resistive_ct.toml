name = "unstructured_resistive_ct"
initializer = "BrioWu"

[backend]
mesh_type = "unstructured"
device = "cpu"
mode = "native"

[mesh]
kind = "cartesian"
cells = [128, 2, 2]
lower = [0.0, 0.0, 0.0]
upper = [1.0, 0.02, 0.02]

[mesh.boundaries]
xlo = "zero_gradient"
xhi = "zero_gradient"
ylo = "zero_gradient"
yhi = "zero_gradient"
zlo = "zero_gradient"
zhi = "zero_gradient"

[physics]
equations = "MHD"
gamma = 1.6666666666666667
gas_constant = 1.0
prandtl = 0.72
wall_temperature = 0.0
viscous = false
resistive = true
resistivity = 0.01
ct = true

[numerics]
order = 2
riemann = "rusanov"
cfl = 0.2
positivity_mode = "strict"
density_floor = 1.0e-8
pressure_floor = 1.0e-8

[time]
final_time = 0.01
max_steps = 10000
output_interval = 100

[output]
directory = "PLT/unstructured_resistive_ct"
write = true

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">CT 的离散 Stokes 更新</title>
  <desc id="desc">面磁通由围绕该面的四条有向边 EMF 线积分更新。</desc>
  <defs>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <style>
      .label { font: 19px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill:#111827; }
      .small { font: 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill:#4b5563; }
    </style>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="42" y="46" class="label" font-weight="700">Constrained Transport：用边线积分更新面磁通</text>

  <rect x="135" y="105" width="390" height="285" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <path d="M160 105 H500" stroke="#dc2626" stroke-width="7" marker-end="url(#arrRed)"/>
  <path d="M525 130 V365" stroke="#dc2626" stroke-width="7" marker-end="url(#arrRed)"/>
  <path d="M500 390 H160" stroke="#dc2626" stroke-width="7" marker-end="url(#arrRed)"/>
  <path d="M135 365 V130" stroke="#dc2626" stroke-width="7" marker-end="url(#arrRed)"/>

  <path d="M330 330 V175" stroke="#2563eb" stroke-width="9" marker-end="url(#arrBlue)"/>
  <text x="250" y="260" class="label" font-weight="700">Φ_B = (B·n)A</text>
  <text x="205" y="287" class="small">面上的权威磁场状态</text>

  <text x="235" y="92" class="small">有向边 EMF：∫ E·dl</text>
  <text x="600" y="135" class="label" font-weight="700">离散 Stokes 定理</text>
  <text x="600" y="180" class="label">Φ_Bⁿ⁺¹ = Φ_Bⁿ - Δt Σ sₑ ℰₑ</text>
  <text x="600" y="224" class="small">ℰₑ 是完整边线积分，不是笛卡尔 Ex/Ey/Ez 点值。</text>
  <text x="600" y="254" class="small">sₑ 由面与边的相对方向决定。</text>
  <text x="600" y="292" class="small">相邻面必须共享同一条有向边 EMF。</text>
  <text x="600" y="318" class="small">先统一 edge owner，再更新两侧面磁通，</text>
  <text x="600" y="344" class="small">离散散度中的内部边贡献才会相消。</text>
  <rect x="590" y="370" width="310" height="80" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="610" y="402" class="small" fill="#991b1b">常见错误：把面磁通当作 Bx，</text>
  <text x="610" y="428" class="small" fill="#991b1b">或把边 EMF 当作未乘边长的电场。</text>
</svg>
